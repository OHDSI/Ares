packages:
  - frontend
  - backend
  - documentation

minimumReleaseAge: 2880
blockExoticSubdeps: true
trustPolicy: "no-downgrade"
trustPolicyIgnoreAfter: 2880
trustPolicyExclude:
  - "chokidar" # inconsistent provenance attestation in upstream releases

allowBuilds:
  "@duckdb/node-api": true
  "@parcel/watcher": true
  "esbuild": true
  libxmljs2: true
  vue-demi: true
