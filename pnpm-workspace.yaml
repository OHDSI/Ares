packages:
  - frontend
  - backend
  - documentation

registries:
  default: https://registry.npmjs.org/

# Runtime
engineStrict: true

# Supply chain security
minimumReleaseAge: 2880
trustPolicy: "no-downgrade"
trustPolicyIgnoreAfter: 2880
trustPolicyExclude:
  - "chokidar" # inconsistent provenance attestation in upstream releases causes trustPolicy failures

# Dependencies
strictPeerDependencies: true

# Reviewed and allowed build scripts. The rest are blocked
allowBuilds:
  "@duckdb/node-api": true
  "@parcel/watcher": true
  "esbuild": true
  libxmljs2: true
  lz4: false
  vue-demi: true

# Explicit to prevent accidental override via CLI or local config
preferFrozenLockfile: true
lockfile: true
verifyStoreIntegrity: true
strictDepBuilds: true
blockExoticSubdeps: true
