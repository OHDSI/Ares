services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      resources:
        limits:
          memory: 12g
    volumes:
      - workspace:/workspace
    command: sleep infinity
    env_file:
      - path: .env
        required: false
    environment:
      HOSTNAME: "0.0.0.0"
      VITE_HOST: "0.0.0.0"
      POSTGRES_HOST: db
      PGPORT: "5432"
      DATABASE_NAME: dev
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  workspace:
