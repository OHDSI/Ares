name: Security Audit

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093  # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22.22.3

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Audit
        run: pnpm audit --audit-level=high

      - name: Create issue on failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          EXISTING=$(gh issue list \
            --repo "${REPO}" \
            --label "security" \
            --state open \
            --json title \
            --jq '[.[] | select(.title == "Weekly security audit failed")] | length')
          if [ "$EXISTING" -eq 0 ]; then
            gh issue create \
              --repo "${REPO}" \
              --title "Weekly security audit failed" \
              --body "The weekly \`pnpm audit\` found high-severity vulnerabilities. See the [workflow run](${RUN_URL}) for details." \
              --label "security"
          else
            echo "Open security audit issue already exists, skipping."
          fi
