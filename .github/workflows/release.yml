name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  build-release:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: main

      - name: Get version
        id: version
        run: echo "value=$(jq -r '.version' package.json)" >> $GITHUB_OUTPUT

      - name: Validate version
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          [ -n "${VERSION}" ] \
            || { echo "Error: version is empty in package.json"; exit 1; }

          echo "${VERSION}" | grep -qE '^[0-9]+(\.[0-9]+)+([-+][a-zA-Z0-9.]+)?$' \
            || { echo "Error: '${VERSION}' is not a valid version string"; exit 1; }

          PREV=$(git show HEAD^1:package.json | jq -r '.version')
          [ "${VERSION}" != "${PREV}" ] \
            || { echo "Error: package.json version (${VERSION}) was not bumped in this PR"; exit 1; }

          git fetch --tags --quiet
          if git rev-parse "refs/tags/v${VERSION}" &>/dev/null; then
            echo "Error: tag v${VERSION} already exists"
            exit 1
          fi

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093  # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22.22.3

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Extract sample data
        run: |
          test -f sample/frontend/data.zip || { echo "sample/frontend/data.zip not found"; exit 1; }
          unzip -o sample/frontend/data.zip -d frontend/public/

      - name: Build
        run: pnpm run build

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: zip -r "ares-${VERSION}.zip" dist/

      - name: Generate SBOM
        working-directory: ./frontend
        run: pnpm exec cyclonedx-npm --omit dev --output-format JSON --output-file ../sbom.cdx.json

      - name: Attest SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26  # v4.1.0
        with:
          subject-path: ares-${{ steps.version.outputs.value }}.zip
          sbom-path: sbom.cdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: ares-${{ steps.version.outputs.value }}.zip

      - name: Download attestation bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh attestation download "ares-${VERSION}.zip" \
            --repo "${REPO}" \
            --output-dir attestations/

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          printf '%s' "${PR_BODY}" > release-notes.txt
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file release-notes.txt \
            "ares-${VERSION}.zip" \
            "sbom.cdx.json#sbom-cyclonedx.json" \
            attestations/*.sigstore.json